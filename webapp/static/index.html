<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roadbook Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Roadbook Builder <span class="tag">mockup</span></div>
    <div id="summary" class="summary"></div>
  </header>

  <main class="layout">
    <!-- LEFT: GPX files -->
    <aside class="pane files">
      <div class="pane-title">GPX tracks</div>
      <label id="drop" class="drop">
        <input id="upload" type="file" accept=".gpx" multiple hidden>
        Drop .gpx here or <u>browse</u>
      </label>
      <div id="fileList" class="file-list"></div>
    </aside>

    <!-- CENTER: preview -->
    <section class="pane preview">
      <div class="tabs" role="tablist">
        <button class="tab active" data-view="overview">Overview</button>
        <button class="tab" data-view="page">Page layout</button>
        <button class="tab" data-view="final">Final PDF</button>
        <span class="spacer"></span>
        <span id="pageNav" class="page-nav">
          <button id="prevPage" title="Previous page">‹</button>
          <span id="pageLabel">–</span>
          <button id="nextPage" title="Next page">›</button>
        </span>
      </div>
      <div id="stage" class="stage">
        <canvas id="canvas"></canvas>
        <iframe id="pdfFrame" title="Final roadbook PDF" hidden></iframe>
        <div id="empty" class="empty">Select a GPX track on the left.</div>
      </div>
      <div id="strip" class="strip"></div>
    </section>

    <!-- RIGHT: options -->
    <aside class="pane options">
      <div class="pane-title">Options</div>
      <form id="opts" autocomplete="off">
        <label class="field">
          <span>Pages <output id="pagesOut">4</output></span>
          <input name="pages" type="range" min="1" max="12" value="4">
          <small id="pagesNote" class="note"></small>
        </label>

        <div id="splitField" class="field">
          <label class="field">
            <span>Page split</span>
            <select name="split_mode">
              <option value="equal">Equal distance</option>
              <option value="waypoints">Custom: end pages at waypoints</option>
            </select>
          </label>
          <div id="splitList" class="split-list" hidden></div>
        </div>

        <label class="field">
          <span>Tile zoom <output id="zoomOut">13</output></span>
          <input name="zoom" type="range" min="10" max="17" value="13">
          <small id="zoomNote" class="note"></small>
        </label>

        <label class="field">
          <span>Map provider</span>
          <select name="provider"></select>
        </label>
        <div id="keyFields" hidden>
          <label class="field">
            <span>API key</span>
            <input name="api_key" type="password" placeholder="or set env var on server">
          </label>
          <label class="field">
            <span>Style / map ID</span>
            <input name="style_id" type="text">
          </label>
        </div>

        <label class="field">
          <span>Race title</span>
          <input name="race_title" type="text" placeholder="auto from filename">
        </label>

        <label class="field">
          <span>Waypoint radius <output id="radiusOut">60</output> m</span>
          <input name="waypoint_radius_m" type="range" min="10" max="300" step="10" value="60">
        </label>

        <!-- style: applied to the preview instantly and sent with the render -->
        <div class="pane-title sub">Style</div>
        <label class="field">
          <span>Label font</span>
          <select name="label_font" data-style></select>
        </label>

        <label class="field">
          <span>Map track width <output id="trackOut">1.4</output> pt</span>
          <input name="track_width" type="range" min="0.5" max="4" step="0.1" value="1.4" data-style>
        </label>
        <label class="field">
          <span>Profile line width <output id="profileOut">0.9</output> pt</span>
          <input name="profile_width" type="range" min="0.3" max="3" step="0.1" value="0.9" data-style>
        </label>

        <label class="field">
          <span>Colour scale</span>
          <select name="preset" data-style></select>
        </label>
        <div class="swatches">
          <label><input name="c_desc" type="color" value="#0000ff" data-style><small>descent</small></label>
          <label><input name="c_flat" type="color" value="#800080" data-style><small>flat</small></label>
          <label><input name="c_climb" type="color" value="#ff0000" data-style><small>climb</small></label>
        </div>
        <div id="scalePreview" class="scale-preview"></div>
        <label class="field">
          <span>Full colour at <output id="gradeOut">auto</output></span>
          <input name="grade_max" type="range" min="0" max="50" step="1" value="0" data-style>
          <small class="note">0 = auto from the track (97th percentile, 15–35 %)</small>
        </label>

        <div class="field">
          <span class="label-row">Labels</span>
          <small class="note">Drag labels in <b>Page layout</b>. Double-click one to reset it.</small>
          <div class="btn-row">
            <button type="button" id="resetPageLabels" class="ghost">Reset this page</button>
            <button type="button" id="resetAllLabels" class="ghost">Reset all</button>
          </div>
          <small id="labelCount" class="note"></small>
        </div>
      </form>

      <button id="renderBtn" class="primary" disabled>Render roadbook</button>
      <div id="progress" class="progress" hidden>
        <div class="bar"><div id="barFill"></div></div>
        <div id="progressMsg" class="note"></div>
      </div>

      <div class="pane-title sub">Recent output</div>
      <div id="outputList" class="output-list"></div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
